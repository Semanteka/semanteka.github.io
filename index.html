<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>emanteka</title>
  <link rel="icon" href="semanteka-32.png" type="image/png" sizes="32x32">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 1.25rem;
      background: #f4f1e9;
      color: #20342d;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(1.5rem, 7vw, 4rem);
      border: 1px solid #dbdfd5;
      border-radius: 1.25rem;
      background: #fffdf8;
    }

    h1 {
      margin: 0 0 1rem;
      font-family: Georgia, serif;
      font-size: clamp(2.75rem, 8vw, 5rem);
      font-weight: 400;
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: #45594f;
      font-size: 1.125rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Semanteka</h1>
  </main>
</body>
</html>
